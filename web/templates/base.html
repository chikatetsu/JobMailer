<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Mes offres d'emploi{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='base.css') }}">
{% block extra_head %}{% endblock %}
</head>
<body>

<nav class="main-nav">
  <a href="/" class="nav-link {% if active_page == 'jobs' %}active{% endif %}">
    <span class="nav-icon">📋</span><span class="nav-label">Offres d'emploi</span>
  </a>
  <a href="/jobs-map" class="nav-link {% if active_page == 'jobs-map' %}active{% endif %}">
    <span class="nav-icon">🗺️</span><span class="nav-label">Carte des offres</span>
  </a>
  <a href="/companies" class="nav-link {% if active_page == 'companies' %}active{% endif %}">
    <span class="nav-icon">🏢</span><span class="nav-label">Entreprises</span>
  </a>
  <a href="/companies-map" class="nav-link {% if active_page == 'companies-map' %}active{% endif %}">
    <span class="nav-icon">📍</span><span class="nav-label">Carte des entreprises</span>
  </a>
</nav>

{% block subheader %}{% endblock %}

<main class="page-main">
  {% block content %}{% endblock %}
</main>

{% block scripts %}{% endblock %}
</body>
</html>
